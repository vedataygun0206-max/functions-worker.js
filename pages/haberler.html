<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yayınlanan Haberler | Digital Gündem</title>

<link rel="stylesheet" href="../style.css">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f5f7;
    font-family:Arial,Helvetica,sans-serif;
    color:#111827;
}

.admin-header{
    background:#111827;
    color:white;
    padding:18px 20px;
}

.admin-header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.admin-header h1{
    margin:0;
    font-size:24px;
}

.btn{
    display:inline-block;
    border:0;
    border-radius:7px;
    padding:9px 13px;
    text-decoration:none;
    cursor:pointer;
    font-weight:600;
}

.btn-home{
    background:#e50914;
    color:white;
}

.content{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.panel{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.panel h2{
    margin-top:0;
}

.arama{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:20px;
    font-size:16px;
}

.haber{
    border:1px solid #e1e4e8;
    border-radius:10px;
    padding:16px;
    margin-bottom:15px;
}

.haber-ust{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
}

.haber-kod{
    display:inline-block;
    background:#111827;
    color:white;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.haber h3{
    margin:10px 0 8px;
    font-size:20px;
}

.meta{
    color:#666;
    font-size:14px;
    margin-bottom:12px;
}

.resim{
    width:150px;
    height:95px;
    object-fit:cover;
    border-radius:8px;
}

.islemler{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
}

.btn-duzenle{
    background:#2563eb;
    color:white;
}

.btn-sil{
    background:#dc2626;
    color:white;
}

.btn-resim{
    background:#059669;
    color:white;
}

.btn-bilgi{
    background:#d97706;
    color:white;
}

.btn-gor{
    background:#6b7280;
    color:white;
}

.bos{
    text-align:center;
    padding:40px 15px;
    color:#666;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    padding:20px;
    overflow:auto;
}

.modal-box{
    max-width:650px;
    margin:50px auto;
    background:white;
    border-radius:12px;
    padding:22px;
}

.modal-box h3{
    margin-top:0;
}

.modal input,
.modal textarea{
    width:100%;
    padding:11px;
    margin:7px 0 12px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:15px;
}

.modal textarea{
    min-height:150px;
    resize:vertical;
}

.modal-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn-kapat{
    background:#6b7280;
    color:white;
}

.mesaj{
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    display:none;
}

@media(max-width:700px){

    .admin-header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    .haber-ust{
        flex-direction:column;
    }

    .resim{
        width:100%;
        height:auto;
        max-height:250px;
    }

    .islemler .btn{
        flex:1 1 45%;
    }
}
</style>
</head>

<body>

<header class="admin-header">
    <div class="admin-header-inner">

        <h1>📰 Yayınlanan Haberler</h1>

        <a href="admin.html" class="btn btn-home">
            ← Yönetim Paneli
        </a>

    </div>
</header>

<main class="content">

<div class="panel">

    <h2>Yayınlanan Haberler</h2>

    <input
        type="text"
        id="arama"
        class="arama"
        placeholder="🔎 Haber ara..."
    >

    <div id="mesaj" class="mesaj"></div>

    <div id="haberler">
        <div class="bos">
            Haberler yükleniyor...
        </div>
    </div>

</div>

</main>


<!-- =========================
     DÜZENLE MODAL
========================= -->

<div id="duzenleModal" class="modal">

    <div class="modal-box">

        <h3>✏️ Haberi Düzenle</h3>

        <input type="hidden" id="duzenleId">

        <label>Başlık</label>
        <input id="duzenleBaslik">

        <label>Özet</label>
        <textarea id="duzenleOzet"></textarea>

        <label>Haber İçeriği</label>
        <textarea id="duzenleIcerik"></textarea>

        <label>Kategori</label>
        <input id="duzenleKategori">

        <label>Resim URL</label>
        <input id="duzenleResim">

        <div class="modal-buttons">

            <button class="btn btn-duzenle" onclick="haberiGuncelle()">
                💾 Güncelle
            </button>

            <button class="btn btn-kapat" onclick="modalKapat('duzenleModal')">
                İptal
            </button>

        </div>

    </div>

</div>


<!-- =========================
     YENİ BİLGİ MODAL
========================= -->

<div id="bilgiModal" class="modal">

    <div class="modal-box">

        <h3>➕ Habere Yeni Bilgi Ekle</h3>

        <input type="hidden" id="bilgiId">

        <label>Yeni Bilgi / Gelişme</label>

        <textarea
            id="yeniBilgi"
            placeholder="Habere sonradan gelen yeni bilgiyi yazın..."
        ></textarea>

        <div class="modal-buttons">

            <button class="btn btn-bilgi" onclick="yeniBilgiEkle()">
                📢 Bilgiyi Ekle
            </button>

            <button class="btn btn-kapat" onclick="modalKapat('bilgiModal')">
                İptal
            </button>

        </div>

    </div>

</div>


<!-- =========================
     RESİM MODAL
========================= -->

<div id="resimModal" class="modal">

    <div class="modal-box">

        <h3>🖼️ Habere Resim Ekle</h3>

        <input type="hidden" id="resimId">

        <label>Resim URL</label>

        <input
            id="yeniResim"
            placeholder="https://..."
        >

        <div class="modal-buttons">

            <button class="btn btn-resim" onclick="resimEkle()">
                🖼️ Resmi Ekle
            </button>

            <button class="btn btn-kapat" onclick="modalKapat('resimModal')">
                İptal
            </button>

        </div>

    </div>

</div>


<script>

let tumHaberler = [];


/* =========================
   HABERLERİ GETİR
========================= */

async function haberleriGetir(){

    const alan = document.getElementById("haberler");

    try{

        const cevap = await fetch("../api/haberler");

        const veri = await cevap.json();

        if(!veri.success){

            throw new Error(
                veri.error || "Haberler alınamadı."
            );

        }

        tumHaberler = veri.haberler || [];

        haberleriGoster(tumHaberler);

    }catch(error){

        alan.innerHTML = `
            <div class="bos">
                <h3>Haberler yüklenemedi</h3>
                <p>${escapeHTML(error.message)}</p>
            </div>
        `;

    }

}


/* =========================
   HABERLERİ GÖSTER
========================= */

function haberleriGoster(liste){

    const alan = document.getElementById("haberler");

    if(!liste.length){

        alan.innerHTML = `
            <div class="bos">
                Henüz yayınlanan haber bulunmuyor.
            </div>
        `;

        return;
    }

    alan.innerHTML = liste.map((haber,index)=>{

        const kod =
            haber.haber_kodu ||
            "H" + String(haber.id).padStart(5,"0");

        return `

        <article class="haber">

            <div class="haber-ust">

                <div>

                    <span class="haber-kod">
                        ${escapeHTML(kod)}
                    </span>

                    <h3>
                        ${escapeHTML(haber.baslik || "")}
                    </h3>

                    <div class="meta">

                        📂 ${escapeHTML(haber.kategori || "Gündem")}
                        &nbsp; • &nbsp;

                        📅 ${escapeHTML(haber.tarih || "")}

                    </div>

                    <div>

                        ${escapeHTML(
                            haber.ozet || ""
                        )}

                    </div>

                </div>

                ${
                    haber.resim
                    ?
                    `<img
                        class="resim"
                        src="${escapeHTML(haber.resim)}"
                        onerror="this.style.display='none'"
                    >`
                    :
                    ""
                }

            </div>

            <div class="islemler">

                <button
                    class="btn btn-gor"
                    onclick="haberiGor(${haber.id})">
                    👁️ Görüntüle
                </button>

                <button
                    class="btn btn-duzenle"
                    onclick="duzenleAc(${haber.id})">
                    ✏️ Düzenle
                </button>

                <button
                    class="btn btn-resim"
                    onclick="resimAc(${haber.id})">
                    🖼️ Resim Ekle
                </button>

                <button
                    class="btn btn-bilgi"
                    onclick="bilgiAc(${haber.id})">
                    ➕ Yeni Bilgi
                </button>

                <button
                    class="btn btn-sil"
                    onclick="haberiSil(${haber.id})">
                    🗑️ Sil
                </button>

            </div>

        </article>

        `;

    }).join("");

}


/* =========================
   DÜZENLE
========================= */

function duzenleAc(id){

    const haber =
        tumHaberler.find(h => Number(h.id) === Number(id));

    if(!haber) return;

    document.getElementById("duzenleId").value = haber.id;
    document.getElementById("duzenleBaslik").value = haber.baslik || "";
    document.getElementById("duzenleOzet").value = haber.ozet || "";
    document.getElementById("duzenleIcerik").value = haber.icerik || "";
    document.getElementById("duzenleKategori").value = haber.kategori || "";
    document.getElementById("duzenleResim").value = haber.resim || "";

    document.getElementById("duzenleModal").style.display = "block";
}


/* =========================
   GÜNCELLE
========================= */

async function haberiGuncelle(){

    const id =
        document.getElementById("duzenleId").value;

    const data = {

        baslik:
            document.getElementById("duzenleBaslik").value,

        ozet:
            document.getElementById("duzenleOzet").value,

        icerik:
            document.getElementById("duzenleIcerik").value,

        kategori:
            document.getElementById("duzenleKategori").value,

        resim:
            document.getElementById("duzenleResim").value,

        durum:"yayinda"

    };

    try{

        const cevap = await fetch(
            "../api/haber?id=" + encodeURIComponent(id),
            {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(data)
            }
        );

        const veri = await cevap.json();

        if(!veri.success){

            throw new Error(
                veri.error || "Güncelleme başarısız."
            );

        }

        modalKapat("duzenleModal");

        mesajGoster("Haber başarıyla güncellendi.");

        haberleriGetir();

    }catch(error){

        alert(error.message);

    }

}


/* =========================
   SİL
========================= */

async function haberiSil(id){

    if(!confirm(
        "Bu haberi silmek istediğinize emin misiniz?"
    )) return;

    try{

        const cevap = await fetch(
            "../api/haber?id=" + encodeURIComponent(id),
            {
                method:"DELETE"
            }
        );

        const veri = await cevap.json();

        if(!veri.success){

            throw new Error(
                veri.error || "Silme işlemi başarısız."
            );

        }

        mesajGoster("Haber silindi.");

        haberleriGetir();

    }catch(error){

        alert(error.message);

    }

}


/* =========================
   RESİM
========================= */

function resimAc(id){

    document.getElementById("resimId").value = id;

    document.getElementById("yeniResim").value = "";

    document.getElementById("resimModal").style.display = "block";
}


async function resimEkle(){

    const id =
        document.getElementById("resimId").value;

    const resim =
        document.getElementById("yeniResim").value.trim();

    if(!resim){

        alert("Resim URL adresini girin.");

        return;
    }

    const haber =
        tumHaberler.find(
            h => Number(h.id) === Number(id)
        );

    if(!haber) return;

    try{

        const cevap = await fetch(
            "../api/haber?id=" + encodeURIComponent(id),
            {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({

                    baslik:haber.baslik,
                    ozet:haber.ozet,
                    icerik:haber.icerik,
                    kategori:haber.kategori,
                    resim:resim,
                    tarih:haber.tarih,
                    durum:"yayinda",
                    manset:!!haber.manset

                })
            }
        );

        const veri = await cevap.json();

        if(!veri.success){

            throw new Error(
                veri.error || "Resim eklenemedi."
            );

        }

        modalKapat("resimModal");

        mesajGoster("Resim güncellendi.");

        haberleriGetir();

    }catch(error){

        alert(error.message);

    }

}


/* =========================
   YENİ BİLGİ
========================= */

function bilgiAc(id){

    document.getElementById("bilgiId").value = id;

    document.getElementById("yeniBilgi").value = "";

    document.getElementById("bilgiModal").style.display = "block";
}


async function yeniBilgiEkle(){

    const id =
        document.getElementById("bilgiId").value;

    const bilgi =
        document.getElementById("yeniBilgi").value.trim();

    if(!bilgi){

        alert("Yeni bilgiyi yazın.");

        return;
    }

    const haber =
        tumHaberler.find(
            h => Number(h.id) === Number(id)
        );

    if(!haber) return;

    const yeniIcerik =
        (haber.icerik || "") +
        "\n\n--- YENİ BİLGİ ---\n" +
        bilgi;

    try{

        const cevap = await fetch(
            "../api/haber?id=" + encodeURIComponent(id),
            {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({

                    baslik:haber.baslik,
                    ozet:haber.ozet,
                    icerik:yeniIcerik,
                    kategori:haber.kategori,
                    resim:haber.resim,
                    tarih:haber.tarih,
                    durum:"yayinda",
                    manset:!!haber.manset

                })
            }
        );

        const veri = await cevap.json();

        if(!veri.success){

            throw new Error(
                veri.error || "Yeni bilgi eklenemedi."
            );

        }

        modalKapat("bilgiModal");

        mesajGoster("Yeni bilgi habere eklendi.");

        haberleriGetir();

    }catch(error){

        alert(error.message);

    }

}


/* =========================
   GÖRÜNTÜLE
========================= */

function haberiGor(id){

    window.location.href =
        "haber.html?id=" +
        encodeURIComponent(id);

}


/* =========================
   ARAMA
========================= */

document.getElementById("arama")
.addEventListener("input",function(){

    const kelime =
        this.value
            .toLocaleLowerCase("tr-TR")
            .trim();

    if(!kelime){

        haberleriGoster(tumHaberler);

        return;
    }

    const sonuc =
        tumHaberler.filter(haber => {

            const metin =
                (
                    (haber.baslik || "") +
                    " " +
                    (haber.ozet || "") +
                    " " +
                    (haber.kategori || "")
                ).toLocaleLowerCase("tr-TR");

            return metin.includes(kelime);

        });

    haberleriGoster(sonuc);

});


/* =========================
   MODAL
========================= */

function modalKapat(id){

    document.getElementById(id).style.display = "none";

}

window.addEventListener("click",function(event){

    document.querySelectorAll(".modal")
    .forEach(modal => {

        if(event.target === modal){

            modal.style.display = "none";

        }

    });

});


/* =========================
   MESAJ
========================= */

function mesajGoster(metin){

    const mesaj =
        document.getElementById("mesaj");

    mesaj.textContent = metin;

    mesaj.style.display = "block";

    setTimeout(()=>{

        mesaj.style.display = "none";

    },3000);

}


/* =========================
   HTML GÜVENLİK
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* BAŞLAT */

haberleriGetir();

</script>

</body>
</html>
