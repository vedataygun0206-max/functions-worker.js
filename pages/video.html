<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Haberler - Digital Gündem</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111827; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .geri-don { display: inline-block; margin-bottom: 20px; color: #cbd5e1; text-decoration: none; background: #334155; padding: 8px 15px; border-radius: 6px; font-size: 14px; }
        h1 { color: #ffffff; border-bottom: 2px solid #d60000; padding-bottom: 10px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-card { background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; border: 1px solid #334155; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; }
        .video-container iframe, .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .video-title { font-size: 17px; font-weight: bold; color: #ffffff; margin: 0 0 10px 0; line-height: 1.4; }
        .video-meta { font-size: 13px; color: #94a3b8; display: flex; justify-content: space-between; }
        .yok { text-align: center; color: #94a3b8; padding: 40px; font-size: 16px; grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="container">
    <a href="../index.html" class="geri-don">⬅️ Ana Sayfaya Dön</a>
    <h1>🎥 Video Haberler</h1>
    <div id="videoListesi" class="video-grid">
        <p class="yok">Videolar yükleniyor...</p>
    </div>
</div>

<script>
    async function videolariGetir() {
        try {
            const cevap = await fetch('/api/videolar');
            const sonuc = await cevap.json();
            
            const listeDiv = document.getElementById('videoListesi');
            
            if (!sonuc.success || !sonuc.videolar || sonuc.videolar.length === 0) {
                listeDiv.innerHTML = '<p class="yok">Henüz eklenmiş video haber bulunmuyor.</p>';
                return;
            }

            let html = '';
            sonuc.videolar.forEach(video => {
                let embedHtml = '';
                const vUrl = video.video_url || '';

                if (vUrl.includes('youtube.com') || vUrl.includes('youtu.be')) {
                    let videoId = '';
                    if (vUrl.includes('youtu.be/')) {
                        videoId = vUrl.split('youtu.be/')[1].split('?')[0];
                    } else if (vUrl.includes('watch?v=')) {
                        videoId = vUrl.split('watch?v=')[1].split('&')[0];
                    } else if (vUrl.includes('embed/')) {
                        videoId = vUrl.split('embed/')[1].split('?')[0];
                    }
                    embedHtml = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                } else {
                    embedHtml = `<video src="${vUrl}" controls poster="${video.kapak_resmi || ''}"></video>`;
                }

                html += `
                    <div class="video-card">
                        <div class="video-container">
                            ${embedHtml}
                        </div>
                        <div class="video-content">
                            <h3 class="video-title">${video.baslik}</h3>
                            <div class="video-meta">
                                <span>📅 ${video.tarih || ''}</span>
                                <span>👁️ ${video.izlenme || 0} İzlenme</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            listeDiv.innerHTML = html;

        } catch (error) {
            console.error('Video yükleme hatası:', error);
            document.getElementById('videoListesi').innerHTML = '<p class="yok">Videolar yüklenirken bir hata oluştu.</p>';
        }
    }

    videolariGetir();
</script>

</body>
</html>
