<!-- ========================================
     ÜST KISIM
======================================== -->

<header class="haber-header">

<!-- ========================================
     HABER
======================================== -->

<main class="haber-wrapper">

    <div id="haberAlani">

        <div class="yukleniyor">
            Haber yükleniyor...
        </div>

    </div>

</main>


<footer class="site-footer">
    © 2026 Digital Gündem • Türkiye'nin Dijital Gündemi
</footer>


<script>

document.addEventListener("DOMContentLoaded", async function () {

    const haberAlani = document.getElementById("haberAlani");

    /* URL'DEN ID AL */

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get("id");


    /* ID YOKSA */

    if (!id) {

        haberAlani.innerHTML = `
            <div class="hata">
                <h2>Haber bulunamadı</h2>
                <p>Haber ID belirtilmedi.</p>
                <a href="/">Ana Sayfaya Dön</a>
            </div>
        `;

        return;
    }


    /* HABERİ API'DEN AL */

    try {

        const cevap = await fetch(
            "/api/haber?id=" + encodeURIComponent(id),
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            }
        );


        const veri = await cevap.json();


        console.log("Digital Gündem Haber:", veri);


        /* API HATASI */

        if (!cevap.ok || !veri.success || !veri.haber) {

            throw new Error(
                veri.error || "Haber bulunamadı."
            );

        }


        const haber = veri.haber;


        /* SAYFA BAŞLIĞI */

        document.title =
            (haber.baslik || "Haber") +
            " | Digital Gündem";


        /* VERİLER */

        const baslik =
            haber.baslik || "Başlıksız Haber";

        const kategori =
            haber.kategori || "Gündem";

        const tarih =
            haber.tarih || "";

        const ozet =
            haber.ozet || "";

        const icerik =
            haber.icerik || "";

        const resim =
            haber.resim || "";


        /* RESİM */

        let resimHTML = "";

        if (resim.trim() !== "") {

            resimHTML = `
                <img
                    class="haber-resim"
                    src="${escapeHTML(resim)}"
                    alt="${escapeHTML(baslik)}"
                    onerror="this.style.display='none';"
                >
            `;

        }


        /* HABERİ GÖSTER */

        haberAlani.innerHTML = `

            <article class="haber-detay">

                <span class="haber-kategori">
                    ${escapeHTML(kategori)}
                </span>

                <h1 class="haber-baslik">
                    ${escapeHTML(baslik)}
                </h1>

                <small class="haber-tarih">
                    ${escapeHTML(tarih)}
                </small>

                ${resimHTML}

                ${
                    ozet.trim()
                    ? `
                        <div class="haber-ozet">
                            ${escapeHTML(ozet)}
                        </div>
                    `
                    : ""
                }

                ${
                    icerik.trim()
                    ? `
                        <div class="haber-icerik">
                            ${escapeHTML(icerik)}
                        </div>
                    `
                    : ""
                }

                <div class="haber-kaynak">
                    Digital Gündem
                </div>

            </article>

        `;


    } catch (error) {

        console.error(
            "Haber yükleme hatası:",
            error
        );


        haberAlani.innerHTML = `

            <div class="hata">

                <h2>Haber yüklenemedi</h2>

                <p>
                    ${escapeHTML(error.message)}
                </p>

                <a href="/">
                    Ana Sayfaya Dön
                </a>

            </div>

        `;

    }

});


/* ========================================
   HTML GÜVENLİK
======================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
