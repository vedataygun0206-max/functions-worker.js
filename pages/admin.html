<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Gündem | Yönetim Paneli</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
<div class="logo">
<h1>🔐 Yönetim Paneli</h1>
<p>Digital Gündem Yönetim Sistemi</p>
</div>

<nav>
<a href="../index.html">🏠 Siteye Dön</a>
</nav>
</header>

<section class="quick-links">

<h2>📰 Yeni Haber</h2>

<input type="text" id="baslik" placeholder="📝 Haber Başlığı">

<select id="kategori">
<option>Gündem</option>
<option>Son Dakika</option>
<option>Siyaset</option>
<option>Yerel Haber</option>
<option>Ekonomi</option>
<option>Spor</option>
<option>Teknoloji</option>
<option>Sağlık</option>
<option>Kültür Sanat</option>
<option>Dünya</option>
</select>

<textarea id="ozet" rows="3" placeholder="📄 Kısa Haber Özeti"></textarea>

<textarea id="detay" rows="10" placeholder="📰 Haber Detayı"></textarea>

<input type="file" id="haberResim" accept="image/*">

<label>
<input type="checkbox" id="manset">
⭐ Manşete Çıkar
</label>

<button type="button">💾 Taslak Kaydet</button>

<button type="submit">📰 Yayınla</button>
  <section class="quick-links">

<h2>📰 Yeni Haber Ekle</h2>

<form id="haberForm">

<input type="text" id="baslik" placeholder="Haber Başlığı" required>

<select id="kategori">
<option>Gündem</option>
<option>Son Dakika</option>
<option>Ekonomi</option>
<option>Spor</option>
<option>Teknoloji</option>
<option>Sağlık</option>
</select>

<label>📷 Fotoğraf Seç</label>

<input type="file" id="haberResim" accept="image/*" capture="environment">
<textarea id="ozet" rows="5" placeholder="Haber Özeti"></textarea>

<button type="submit">📰 Haberi Yayınla</button>

</form>

  </section>

<footer>
<p>© 2026 Digital Gündem</p>
<p>Tarafsız bakar, doğruyu yayınlar.</p>
</footer>
  
<script src="../admin.js"></script>
  
</body>
</html>
