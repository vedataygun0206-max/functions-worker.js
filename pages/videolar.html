<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Haberleri Yönetimi | Digital Gündem</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .geri-don { display: inline-block; margin-bottom: 20px; color: #111827; text-decoration: none; background: #e5e7eb; padding: 8px 15px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        h1 { color: #111827; border-bottom: 2px solid #d60000; padding-bottom: 10px; margin-top: 0; }
        
        .video-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; padding: 20px; border: 1px solid #e5e7eb; }
        .video-meta-top { font-size: 13px; color: #6b7280; margin-bottom: 10px; display: flex; gap: 15px; align-items: center; }
        .video-title { font-size: 18px; font-weight: bold; color: #1f2937; margin: 0 0 15px 0; }
        
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .video-container iframe, .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; color: white; }
        
        .btn-goruntule { background: #6b7280; }
        .btn-goruntule:hover { background: #4b5563; }
        
        .btn-duzenle { background: #2563eb; }
        .btn-duzenle:hover { background: #1d4ed8; }
        
        .btn-sil { background: #dc2626; }
        .btn-sil:hover { background: #b91c1c; }

        /* Düzenleme Alanı */
        .duzenle-form { display: none; background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #cbd5e1; }
        .duzenle-form input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-kaydet { background: #16a34a; color: white; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-kaydet:hover { background: #15803d; }
        .btn-iptal { background: #64748b; color: white; width: 100%; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        .yok { text-align: center; color: #666; padding: 40px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <a href="admin.html" class="geri-don">⬅️ Yönetim Paneline Dön</a>
    <h1>🎥 Video Haberleri Yönetimi</h1>
    <div id="videoListesi">
        <p class="yok">Videolar yükleniyor...</p>
    </div>
</div>

<script>
    async function videolariGetir() {
        try {
            const cevap = await fetch('/api/videolar');
            const sonuc = await cevap.json();
            
            const listeDiv = document.getElementById('videoListesi');
            
            if (!sonuc.success || !sonuc.videolar || sonuc.videolar.length === 0) {
                listeDiv.innerHTML = '<p class="yok">Henüz eklenmiş video haber bulunmuyor.</p>';
                return;
            }

            let html = '';
            sonuc.videolar.forEach(video => {
                let embedHtml = '';
                const vUrl = video.video_url || '';

                if (vUrl.includes('youtube.com') || vUrl.includes('youtu.be')) {
                    let videoId = '';
                    if (vUrl.includes('youtu.be/')) {
                        videoId = vUrl.split('youtu.be/')[1].split('?')[0];
                    } else if (vUrl.includes('watch?v=')) {
                        videoId = vUrl.split('watch?v=')[1].split('&')[0];
                    } else if (vUrl.includes('embed/')) {
                        videoId = vUrl.split('embed/')[1].split('?')[0];
                    }
                    embedHtml = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                } else {
                    embedHtml = `<video src="${vUrl}" controls poster="${video.kapak_resmi || ''}"></video>`;
                }

                html += `
                    <div class="video-card" id="card-${video.id}">
                        <div class="video-meta-top">
                            <span>📁 Video Haber</span> 
                            <span>📅 ${video.tarih || ''}</span>
                            <span>👁️ ${video.izlenme || 0} İzlenme</span>
                        </div>
                        <h3 class="video-title" id="title-text-${video.id}">${video.baslik}</h3>
                        
                        <div class="video-container">
                            ${embedHtml}
                        </div>

                        <div class="btn-group" id="buttons-${video.id}">
                            <a href="${vUrl}" target="_blank" class="btn btn-goruntule">👁️ Görüntüle</a>
                            <button class="btn btn-duzenle" onclick="formuAc(${video.id})">✏️ Düzenle</button>
                            <button class="btn btn-sil" onclick="videoSil(${video.id})">🗑️ Sil</button>
                        </div>

                        <!-- Düzenleme Formu -->
                        <div class="duzenle-form" id="form-${video.id}">
                            <h4>Video Düzenle</h4>
                            <label>Başlık:</label>
                            <input type="text" id="edit-baslik-${video.id}" value="${video.baslik}">
                            <label>Video URL:</label>
                            <input type="text" id="edit-url-${video.id}" value="${video.video_url}">
                            <button class="btn-kaydet" onclick="videoGuncelle(${video.id})">💾 Kaydet</button>
                            <button class="btn-iptal" onclick="formuKapat(${video.id})">İptal</button>
                        </div>
                    </div>
                `;
            });

            listeDiv.innerHTML = html;

        } catch (error) {
            console.error('Video yükleme hatası:', error);
            document.getElementById('videoListesi').innerHTML = '<p class="yok">Videolar yüklenirken bir hata oluştu.</p>';
        }
    }

    function formuAc(id) {
        document.getElementById(`form-${id}`).style.display = 'block';
    }

    function formuKapat(id) {
        document.getElementById(`form-${id}`).style.display = 'none';
    }

    async function videoGuncelle(id) {
        const yeniBaslik = document.getElementById(`edit-baslik-${id}`).value;
        const yeniUrl = document.getElementById(`edit-url-${id}`).value;

        try {
            const cevap = await fetch('/api/videolar-guncelle', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, baslik: yeniBaslik, video_url: yeniUrl })
            });
            const sonuc = await cevap.json();

            if (sonuc.success) {
                alert('Video başarıyla güncellendi.');
                videolariGetir();
            } else {
                alert('Güncelleme başarısız: ' + (sonuc.error || 'Bilinmeyen hata'));
            }
        } catch (error) {
            console.error('Güncelleme hatası:', error);
            alert('Güncellenirken bir hata oluştu.');
        }
    }

    async function videoSil(id) {
        if (!confirm('Bu video haberi silmek istediğinize emin misiniz?')) return;

        try {
            const cevap = await fetch(`/api/videolar-sil?id=${id}`, { method: 'DELETE' });
            const sonuc = await cevap.json();

            if (sonuc.success) {
                alert('Video başarıyla silindi.');
                videolariGetir();
            } else {
                alert('Silme başarısız: ' + (sonuc.error || 'Bilinmeyen hata'));
            }
        } catch (error) {
            console.error('Silme hatası:', error);
            alert('Silinirken bir hata oluştu.');
        }
    }

    videolariGetir();
</script>

</body>
</html>
