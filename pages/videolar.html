<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Video Haberleri Yönetimi | Digital Gündem</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .geri-don { display: inline-block; margin-bottom: 20px; color: #111827; text-decoration: none; background: #e5e7eb; padding: 8px 15px; border-radius: 6px; font-weight: bold; }
        .video-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .duzenle-form { display: none; background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
        .btn-duzenle { background: #2563eb; }
        .btn-sil { background: #dc2626; }
        .btn-kaydet { background: #16a34a; }
    </style>
</head>
<body>

<div class="container">
    <a href="../admin.html" class="geri-don">⬅️ Yönetime Dön</a>
    <h1>🎥 Video Haberleri Yönetimi</h1>
    <div id="videoListesi">Videolar yükleniyor...</div>
</div>

<script>
    async function videolariGetir() {
        const cevap = await fetch('/api/videolar');
        const sonuc = await cevap.json();
        const listeDiv = document.getElementById('videoListesi');
        
        let html = '';
        sonuc.videolar.forEach(video => {
            html += `
                <div class="video-card">
                    <h3>${video.baslik}</h3>
                    <button class="btn btn-duzenle" onclick="formuAc(${video.id})">✏️ Düzenle</button>
                    <button class="btn btn-sil" onclick="videoSil(${video.id})">🗑️ Sil</button>
                    
                    <div class="duzenle-form" id="form-${video.id}">
                        <input type="text" id="edit-baslik-${video.id}" value="${video.baslik}">
                        <input type="text" id="edit-url-${video.id}" value="${video.video_url}">
                        <button class="btn btn-kaydet" onclick="videoGuncelle(${video.id})">💾 Kaydet</button>
                    </div>
                </div>
            `;
        });
        listeDiv.innerHTML = html;
    }

    function formuAc(id) { document.getElementById(`form-${id}`).style.display = 'block'; }

    async function videoGuncelle(id) {
        const baslik = document.getElementById(`edit-baslik-${id}`).value;
        const url = document.getElementById(`edit-url-${id}`).value;
        await fetch('/api/videolar-guncelle', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, baslik, video_url: url })
        });
        location.reload();
    }

    async function videoSil(id) {
        await fetch(`/api/videolar-sil?id=${id}`, { method: 'DELETE' });
        location.reload();
    }

    videolariGetir();
</script>
</body>
</html>
