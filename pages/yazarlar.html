<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Gündem | Köşe Yazarları</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f172a;
    color: #f8fafc;
}

.header {
    background: #1e293b;
    padding: 20px;
    border-bottom: 1px solid #334155;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo h1 {
    margin: 0;
    font-size: 25px;
}

.logo p {
    margin: 5px 0 0;
    color: #94a3b8;
}

.btn {
    display: inline-block;
    text-decoration: none;
    border: 0;
    padding: 10px 16px;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    opacity: .9;
}

.btn-danger {
    background: #dc2626;
}

.btn-warning {
    background: #d97706;
}

.btn-success {
    background: #16a34a;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 15px;
}

.page-title {
    margin-bottom: 25px;
}

.page-title h2 {
    margin: 0 0 8px;
    font-size: 28px;
}

.page-title p {
    color: #94a3b8;
    margin: 0;
}


/* FORM */

.form-card {
    background: #1e293b;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 30px;
    border: 1px solid #334155;
}

.form-card h3 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-weight: bold;
    color: #e2e8f0;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 100px;
}

.form-buttons {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}


/* İSTATİSTİK */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.stat-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
}

.stat-card h4 {
    margin: 0 0 10px;
    color: #94a3b8;
}

.stat-card strong {
    font-size: 30px;
}


/* YAZARLAR */

.yazarlar-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 25px;
}

.yazarlar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.yazarlar-header h3 {
    margin: 0;
}

.arama {
    max-width: 300px;
}


/* YAZAR KARTI */

.yazar-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.yazar-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
}

.yazar-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #334155;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    overflow: hidden;
    font-size: 30px;
    font-weight: bold;
}

.yazar-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.yazar-card h4 {
    margin: 0 0 8px;
    font-size: 19px;
}

.yazar-konum {
    color: #60a5fa;
    font-weight: bold;
    margin-bottom: 10px;
}

.yazar-biyografi {
    color: #cbd5e1;
    line-height: 1.5;
    min-height: 45px;
}

.yazar-durum {
    margin: 15px 0;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.badge-aktif {
    background: #14532d;
    color: #86efac;
}

.badge-beklemede {
    background: #78350f;
    color: #fde68a;
}

.badge-pasif {
    background: #7f1d1d;
    color: #fecaca;
}

.yazar-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.yazar-actions button {
    border: 0;
    border-radius: 7px;
    padding: 8px 10px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}


/* MESAJ */

#mesaj {
    display: none;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    font-weight: bold;
}

.mesaj-success {
    display: block !important;
    background: #14532d;
    color: #bbf7d0;
}

.mesaj-error {
    display: block !important;
    background: #7f1d1d;
    color: #fecaca;
}


/* MOBİL */

@media (max-width: 900px) {

    .yazar-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 700px) {

    .header-inner {
        flex-direction: column;
        align-items: flex-start;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .yazar-grid {
        grid-template-columns: 1fr;
    }

    .yazarlar-header {
        flex-direction: column;
        align-items: stretch;
    }

    .arama {
        max-width: 100%;
    }

}

</style>

</head>

<body>


<header class="header">

    <div class="header-inner">

        <div class="logo">

            <h1>📰 Digital Gündem</h1>

            <p>81 İl · 81 Ses · Köşe Yazarları Yönetimi</p>

        </div>

        <div>

            <a href="admin.html" class="btn">
                ← Yönetim Paneli
            </a>

        </div>

    </div>

</header>


<div class="container">


    <div class="page-title">

        <h2>✍️ Köşe Yazarları</h2>

        <p>
            Türkiye'nin 81 ilinden Digital Gündem yazarlarını buradan yönetebilirsiniz.
        </p>

    </div>


    <div id="mesaj"></div>


    <!-- ======================================
         İSTATİSTİKLER
    ======================================= -->

    <div class="stats">

        <div class="stat-card">

            <h4>Toplam Yazar</h4>

            <strong id="toplamYazar">
                0
            </strong>

        </div>

        <div class="stat-card">

            <h4>Aktif Yazar</h4>

            <strong id="aktifYazar">
                0
            </strong>

        </div>

        <div class="stat-card">

            <h4>Bekleyen Yazar</h4>

            <strong id="bekleyenYazar">
                0
            </strong>

        </div>

    </div>


    <!-- ======================================
         YENİ YAZAR
    ======================================= -->

    <section class="form-card">

        <h3>➕ Yeni Yazar Ekle</h3>

        <form id="yazarForm">

            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Ad Soyad
                    </label>

                    <input
                        type="text"
                        id="adSoyad"
                        placeholder="Yazarın adı ve soyadı"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        İl
                    </label>

                    <select id="il" required>

                        <option value="">
                            İl seçiniz
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        İlçe
                    </label>

                    <input
                        type="text"
                        id="ilce"
                        placeholder="İlçe"
                    >

                </div>


                <div class="form-group">

                    <label>
                        E-posta
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="ornek@email.com"
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Fotoğraf URL
                    </label>

                    <input
                        type="text"
                        id="fotograf"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Biyografi
                    </label>

                    <textarea
                        id="biyografi"
                        placeholder="Yazar hakkında kısa bilgi..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Durum
                    </label>

                    <select id="durum">

                        <option value="aktif">
                            Aktif
                        </option>

                        <option value="beklemede">
                            Beklemede
                        </option>

                        <option value="pasif">
                            Pasif
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    💾 Yazarı Kaydet
                </button>

                <button
                    type="button"
                    class="btn btn-warning"
                    onclick="formTemizle()"
                >
                    Temizle
                </button>

            </div>

        </form>

    </section>


    <!-- ======================================
         YAZAR LİSTESİ
    ======================================= -->

    <section class="yazarlar-card">

        <div class="yazarlar-header">

            <h3>
                👥 Kayıtlı Yazarlar
            </h3>

            <input
                type="search"
                id="arama"
                class="arama"
                placeholder="Yazar, il veya ilçe ara..."
            >

        </div>


        <div
            id="yazarListesi"
            class="yazar-grid"
        >

            <p>
                Yazarlar yükleniyor...
            </p>

        </div>

    </section>


</div>


<script>

/* =========================================
   TÜRKİYE 81 İL
========================================= */

const iller = [

"Adana",
"Adıyaman",
"Afyonkarahisar",
"Ağrı",
"Amasya",
"Ankara",
"Antalya",
"Artvin",
"Aydın",
"Balıkesir",
"Bilecik",
"Bingöl",
"Bitlis",
"Bolu",
"Burdur",
"Bursa",
"Çanakkale",
"Çankırı",
"Çorum",
"Denizli",
"Diyarbakır",
"Edirne",
"Elazığ",
"Erzincan",
"Erzurum",
"Eskişehir",
"Gaziantep",
"Giresun",
"Gümüşhane",
"Hakkari",
"Hatay",
"Isparta",
"Mersin",
"İstanbul",
"İzmir",
"Kars",
"Kastamonu",
"Kayseri",
"Kırklareli",
"Kırşehir",
"Kocaeli",
"Konya",
"Kütahya",
"Malatya",
"Manisa",
"Kahramanmaraş",
"Mardin",
"Muğla",
"Muş",
"Nevşehir",
"Niğde",
"Ordu",
"Rize",
"Sakarya",
"Samsun",
"Siirt",
"Sinop",
"Sivas",
"Tekirdağ",
"Tokat",
"Trabzon",
"Tunceli",
"Şanlıurfa",
"Uşak",
"Van",
"Yalova",
"Yozgat",
"Zonguldak",
"Aksaray",
"Bayburt",
"Karaman",
"Kırıkkale",
"Batman",
"Şırnak",
"Bartın",
"Ardahan",
"Iğdır",
"Yalova",
"Karabük",
"Kilis",
"Osmaniye",
"Düzce"

];


/* =========================================
   İLLERİ SELECT'E DOLDUR
========================================= */

const ilSelect =
    document.getElementById("il");

iller.forEach(function(il) {

    const option =
        document.createElement("option");

    option.value = il;

    option.textContent = il;

    ilSelect.appendChild(option);

});


/* =========================================
   DEĞİŞKEN
========================================= */

let yazarlar = [];


/* =========================================
   MESAJ
========================================= */

function mesajGoster(metin, tip) {

    const mesaj =
        document.getElementById("mesaj");

    mesaj.textContent = metin;

    mesaj.className =
        tip === "success"
        ? "mesaj-success"
        : "mesaj-error";

    setTimeout(function() {

        mesaj.className = "";

        mesaj.style.display = "none";

    }, 4000);

}


/* =========================================
   YAZARLARI GETİR
========================================= */

async function yazarlarGetir() {

    const liste =
        document.getElementById("yazarListesi");

    liste.innerHTML =
        "<p>Yazarlar yükleniyor...</p>";

    try {

        const cevap =
            await fetch("/api/yazarlar", {
                credentials: "include"
            });

        const sonuc =
            await cevap.json();

        if (!cevap.ok || sonuc.success === false) {

            throw new Error(
                sonuc.error ||
                "Yazarlar alınamadı."
            );

        }

        yazarlar =
            sonuc.yazarlar || [];

        yazarListesiniGoster();

        istatistikleriGuncelle();

    } catch (hata) {

        console.error(hata);

        liste.innerHTML = `
            <div>
                ❌ Yazarlar yüklenemedi.<br><br>
                ${hata.message}
            </div>
        `;

    }

}


/* =========================================
   LİSTELE
========================================= */

function yazarListesiniGoster() {

    const liste =
        document.getElementById("yazarListesi");

    const arama =
        document.getElementById("arama")
        .value
        .toLocaleLowerCase("tr-TR")
        .trim();


    const filtreli =
        yazarlar.filter(function(yazar) {

            const metin = [

                yazar.ad_soyad,
                yazar.il,
                yazar.ilce,
                yazar.biyografi

            ]
            .join(" ")
            .toLocaleLowerCase("tr-TR");

            return metin.includes(arama);

        });


    if (filtreli.length === 0) {

        liste.innerHTML = `
            <div>
                Henüz yazar bulunamadı.
            </div>
        `;

        return;

    }


    liste.innerHTML = "";


    filtreli.forEach(function(yazar) {

        const kart =
            document.createElement("div");

        kart.className =
            "yazar-card";


        let avatar = "✍️";

        if (yazar.fotograf) {

            avatar = `
                <img
                    src="${escapeHtml(yazar.fotograf)}"
                    alt="${escapeHtml(yazar.ad_soyad)}"
                    onerror="this.style.display='none'"
                >
            `;

        }


        let durumClass =
            "badge-beklemede";

        if (yazar.durum === "aktif") {

            durumClass =
                "badge-aktif";

        }

        if (yazar.durum === "pasif") {

            durumClass =
                "badge-pasif";

        }


        const durumMetni =
            yazar.durum === "aktif"
            ? "Aktif"
            : yazar.durum === "pasif"
            ? "Pasif"
            : "Beklemede";


        kart.innerHTML = `

            <div class="yazar-avatar">

                ${avatar}

            </div>


            <h4>
                ${escapeHtml(yazar.ad_soyad || "")}
            </h4>


            <div class="yazar-konum">

                📍
                ${escapeHtml(yazar.il || "")}

                ${yazar.ilce
                    ? " / " + escapeHtml(yazar.ilce)
                    : ""
                }

            </div>


            <div class="yazar-biyografi">

                ${escapeHtml(
                    yazar.biyografi ||
                    "Biyografi bulunmuyor."
                )}

            </div>


            <div class="yazar-durum">

                <span class="badge ${durumClass}">

                    ● ${durumMetni}

                </span>

            </div>


            <div class="yazar-actions">

                <button
                    class="btn-success"
                    onclick="durumDegistir(${yazar.id}, '${yazar.durum}')"
                >
                    ${yazar.durum === "aktif"
                        ? "⏸ Pasif Yap"
                        : "▶ Aktif Yap"
                    }
                </button>


                <button
                    class="btn-danger"
                    onclick="yazarSil(${yazar.id}, '${escapeJs(yazar.ad_soyad)}')"
                >
                    🗑 Sil
                </button>

            </div>

        `;


        liste.appendChild(kart);

    });

}


/* =========================================
   YAZAR EKLE
========================================= */

document
    .getElementById("yazarForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const veri = {

            ad_soyad:
                document
                .getElementById("adSoyad")
                .value
                .trim(),

            il:
                document
                .getElementById("il")
                .value,

            ilce:
                document
                .getElementById("ilce")
                .value
                .trim(),

            fotograf:
                document
                .getElementById("fotograf")
                .value
                .trim(),

            biyografi:
                document
                .getElementById("biyografi")
                .value
                .trim(),

            email:
                document
                .getElementById("email")
                .value
                .trim(),

            durum:
                document
                .getElementById("durum")
                .value,

            tarih:
                new Date()
                .toLocaleDateString("tr-TR")

        };


        if (!veri.ad_soyad) {

            mesajGoster(
                "Yazar adı zorunludur.",
                "error"
            );

            return;

        }


        if (!veri.il) {

            mesajGoster(
                "Lütfen yazarın ilini seçin.",
                "error"
            );

            return;

        }


        try {

            const cevap =
                await fetch("/api/yazarlar", {

                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(veri)

                });


            const sonuc =
                await cevap.json();


            if (!cevap.ok ||
                sonuc.success === false) {

                throw new Error(
                    sonuc.error ||
                    "Yazar kaydedilemedi."
                );

            }


            mesajGoster(
                "✅ Yazar başarıyla kaydedildi.",
                "success"
            );


            formTemizle();

            await yazarlarGetir();


        } catch (hata) {

            console.error(hata);

            mesajGoster(
                "❌ " + hata.message,
                "error"
            );

        }

    });


/* =========================================
   DURUM DEĞİŞTİR
========================================= */

async function durumDegistir(id, mevcutDurum) {

    const yeniDurum =
        mevcutDurum === "aktif"
        ? "pasif"
        : "aktif";


    try {

        const cevap =
            await fetch(
                "/api/yazarlar/" + id,
                {

                    method: "PUT",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            durum: yeniDurum
                        })

                }
            );


        const sonuc =
            await cevap.json();


        if (!cevap.ok ||
            sonuc.success === false) {

            throw new Error(
                sonuc.error ||
                "Durum değiştirilemedi."
            );

        }


        mesajGoster(
            "✅ Yazar durumu güncellendi.",
            "success"
        );


        await yazarlarGetir();


    } catch (hata) {

        console.error(hata);

        mesajGoster(
            "❌ " + hata.message,
            "error"
        );

    }

}


/* =========================================
   YAZAR SİL
========================================= */

async function yazarSil(id, ad) {

    if (!confirm(
        '"' +
        ad +
        '" adlı yazarı silmek istediğinize emin misiniz?'
    )) {

        return;

    }


    try {

        const cevap =
            await fetch(
                "/api/yazarlar/" + id,
                {

                    method: "DELETE",

                    credentials: "include"

                }
            );


        const sonuc =
            await cevap.json();


        if (!cevap.ok ||
            sonuc.success === false) {

            throw new Error(
                sonuc.error ||
                "Yazar silinemedi."
            );

        }


        mesajGoster(
            "✅ Yazar silindi.",
            "success"
        );


        await yazarlarGetir();


    } catch (hata) {

        console.error(hata);

        mesajGoster(
            "❌ " + hata.message,
            "error"
        );

    }

}


/* =========================================
   FORM TEMİZLE
========================================= */

function formTemizle() {

    document
        .getElementById("yazarForm")
        .reset();

}


/* =========================================
   İSTATİSTİK
========================================= */

function istatistikleriGuncelle() {

    const toplam =
        yazarlar.length;


    const aktif =
        yazarlar.filter(function(yazar) {

            return yazar.durum === "aktif";

        }).length;


    const bekleyen =
        yazarlar.filter(function(yazar) {

            return yazar.durum === "beklemede";

        }).length;


    document
        .getElementById("toplamYazar")
        .textContent = toplam;


    document
        .getElementById("aktifYazar")
        .textContent = aktif;


    document
        .getElementById("bekleyenYazar")
        .textContent = bekleyen;

}


/* =========================================
   ARAMA
========================================= */

document
    .getElementById("arama")
    .addEventListener(
        "input",
        yazarListesiniGoster
    );


/* =========================================
   GÜVENLİ HTML
========================================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeJs(value) {

    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "");

}


/* =========================================
   BAŞLAT
========================================= */

yazarlarGetir();

</script>


</body>
</html>
