<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkiye Haberleri | Digital Gündem</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 35px 40px;
}

.logo {
  font-size: 42px;
  font-weight: bold;
}

.logo span {
  color: #e00000;
}

.subtitle {
  font-size: 24px;
  margin-top: 20px;
}

nav {
  background: #d90000;
  display: flex;
  overflow-x: auto;
  white-space: nowrap;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 23px;
  font-weight: bold;
  padding: 20px 25px;
}

nav a:hover {
  background: #b00000;
}

.container {
  max-width: 1000px;
  margin: 45px auto;
  padding: 0 20px;
}

.intro {
  background: white;
  border-left: 8px solid #d90000;
  border-radius: 25px;
  padding: 35px;
  margin-bottom: 35px;
}

.intro h1 {
  margin: 0;
  font-size: 42px;
}

.intro p {
  font-size: 25px;
  color: #666;
  margin-bottom: 0;
}

.news {
  background: white;
  border-radius: 25px;
  overflow: hidden;
  margin-bottom: 30px;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.news img {
  width: 100%;
  height: 360px;
  object-fit: cover;
  display: block;
}

.no-image {
  height: 360px;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 90px;
}

.content {
  padding: 30px;
}

.category {
  display: inline-block;
  background: #d90000;
  color: white;
  padding: 10px 18px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 18px;
}

h2 {
  font-size: 32px;
  line-height: 1.25;
  margin: 20px 0;
}

.summary {
  font-size: 21px;
  color: #666;
  line-height: 1.5;
}

.date {
  color: #888;
  margin-top: 20px;
}

.error {
  background: #fff;
  padding: 30px;
  border-radius: 20px;
  color: #d00000;
  font-size: 20px;
}

.loading {
  text-align: center;
  font-size: 22px;
  padding: 50px;
}

@media (max-width: 600px) {
  header {
    padding: 30px 25px;
  }

  .logo {
    font-size: 36px;
  }

  .subtitle {
    font-size: 20px;
  }

  nav a {
    font-size: 18px;
    padding: 17px 20px;
  }

  .intro h1 {
    font-size: 34px;
  }

  .intro p {
    font-size: 20px;
  }

  .news img,
  .no-image {
    height: 260px;
  }

  h2 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Digital <span>Gündem</span>
  </div>

  <div class="subtitle">
    Türkiye'nin Dijital Haber Platformu
  </div>
</header>

<nav>
  <a href="/">Ana Sayfa</a>
  <a href="/pages/son-dakika.html">Son Dakika</a>
  <a href="/pages/turkiye.html">Türkiye</a>
  <a href="/pages/dunya.html">Dünya</a>
  <a href="/pages/video.html">Video</a>
</nav>

<div class="container">

  <div class="intro">
    <h1>🇹🇷 Türkiye Haberleri</h1>
    <p>
      Türkiye'den son gelişmeler, gündem ve güncel haberler.
    </p>
  </div>

  <div id="haberler">
    <div class="loading">🇹🇷 Türkiye haberleri yükleniyor...</div>
  </div>

</div>

<script>

async function haberleriGetir() {

  const alan = document.getElementById("haberler");

  try {

    const cevap = await fetch("/api/turkiye");

    if (!cevap.ok) {
      throw new Error("API bağlantısı başarısız");
    }

    const data = await cevap.json();

    console.log("Türkiye API:", data);

    const haberler = data.haberler || [];

    if (
      !data.success ||
      !Array.isArray(haberler) ||
      haberler.length === 0
    ) {

      alan.innerHTML =
        '<div class="error">🇹🇷 Türkiye haberleri bulunamadı.</div>';

      return;
    }

    alan.innerHTML = "";

    haberler.forEach(haber => {

      const kart =
        document.createElement("article");

      kart.className = "news";

      const resim =
        haber.image_url ||
        haber.image ||
        haber.gorsel ||
        "";

      const baslik =
        haber.baslik ||
        haber.title ||
        "Başlık bulunamadı";

      const ozet =
        haber.ozet ||
        haber.summary ||
        haber.description ||
        "";

      const tarih =
        haber.tarih ||
        haber.created_at ||
        "";

      kart.innerHTML = `

        ${
          resim
          ? `
            <img
              src="${resim}"
              alt="${baslik}"
            >
          `
          : `
            <div class="no-image">
              🇹🇷
            </div>
          `
        }

        <div class="content">

          <span class="category">
            TÜRKİYE
          </span>

          <h2>
            ${baslik}
          </h2>

          <div class="summary">
            ${ozet}
          </div>

          ${
            tarih
            ? `
              <div class="date">
                ${new Date(tarih).toLocaleString("tr-TR")}
              </div>
            `
            : ""
          }

          ${
            haber.url
            ? `
              <p style="margin-top:25px;">
                <a
                  href="${haber.url}"
                  target="_blank"
                  rel="noopener"
                  style="
                    display:inline-block;
                    background:#d90000;
                    color:white;
                    padding:12px 20px;
                    border-radius:8px;
                    text-decoration:none;
                    font-weight:bold;
                  "
                >
                  Haberin Kaynağı →
                </a>
              </p>
            `
            : ""
          }

        </div>
      `;

      alan.appendChild(kart);

    });

  } catch (hata) {

    console.error(
      "Türkiye haberleri hatası:",
      hata
    );

    alan.innerHTML = `
      <div class="error">
        ❌ Türkiye haberleri yüklenemedi.
        <br>
        <small>${hata.message}</small>
      </div>
    `;

  }

}

haberleriGetir();

</script>
</body>
</html>
