<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Gündem | Türkiye'nin Dijital Haber Platformu</title>

<meta name="description"
content="Digital Gündem Türkiye ve dünyadan son dakika haberleri, gündem, video ve rehber içerikleri.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f5;
    color:#111827;
}

/* HEADER */

header{
    background:#111827;
    color:white;
    padding:28px 20px 32px;
}

.logo{
    font-size:42px;
    font-weight:800;
}

.logo span{
    color:#e00000;
}

.slogan{
    margin-top:35px;
    font-size:25px;
    color:#fff;
}

/* MENU */

.nav-wrap{
    background:#e00000;
    overflow-x:auto;
    white-space:nowrap;
}

nav{
    display:flex;
    min-width:max-content;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:21px;
    font-weight:700;
    padding:20px 24px;
    display:block;
}

nav a:hover,
nav a.active{
    background:#b90000;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    padding:38px 20px;
}

/* HERO */

.hero{
    background:white;
    border-radius:28px;
    border-left:10px solid #e00000;
    padding:38px 35px;
    margin-bottom:40px;
}

.hero h1{
    font-size:42px;
    margin-bottom:15px;
}

.hero p{
    color:#666;
    font-size:22px;
    line-height:1.5;
}

/* FEATURED */

.featured{
    background:white;
    border-radius:25px;
    overflow:hidden;
    margin-bottom:35px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.featured-image{
    height:390px;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:100px;
}

.featured-content{
    padding:30px;
}

.category{
    display:inline-block;
    background:#e00000;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    font-size:18px;
    font-weight:700;
    margin-bottom:18px;
}

.featured h2{
    font-size:32px;
    line-height:1.25;
    margin-bottom:15px;
}

.featured p{
    color:#666;
    font-size:19px;
    line-height:1.5;
}

/* NEWS GRID */

.news-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.news-card{
    background:white;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.news-image{
    height:220px;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
}

.news-content{
    padding:22px;
}

.news-content h3{
    font-size:22px;
    line-height:1.35;
    margin-bottom:12px;
}

.news-content p{
    color:#666;
    line-height:1.5;
}

/* LOADING */

.loading{
    text-align:center;
    padding:50px;
    font-size:20px;
    color:#777;
}

/* FOOTER */

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:30px 15px;
    margin-top:50px;
}

/* MOBILE */

@media(max-width:700px){

    header{
        padding:25px 20px 28px;
    }

    .logo{
        font-size:35px;
    }

    .slogan{
        margin-top:28px;
        font-size:21px;
    }

    nav a{
        font-size:20px;
        padding:18px 23px;
    }

    .container{
        padding:30px 15px;
    }

    .hero{
        border-left-width:8px;
        border-radius:25px;
        padding:30px 25px;
    }

    .hero h1{
        font-size:36px;
    }

    .hero p{
        font-size:21px;
    }

    .featured-image{
        height:400px;
    }

    .featured-content{
        padding:25px;
    }

    .featured h2{
        font-size:29px;
    }

    .news-grid{
        grid-template-columns:1fr;
    }

    .news-image{
        height:240px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Digital <span>Gündem</span>
    </div>

    <div class="slogan">
        Türkiye'nin Dijital Haber Platformu
    </div>

</header>


<div class="nav-wrap">

<nav>

    <a href="/">Ana Sayfa</a>

    <a href="/pages/son-dakika.html">
        Son Dakika
    </a>

    <a href="/pages/turkiye.html">
        Türkiye
    </a>

    <a href="/pages/dunya.html">
        Dünya
    </a>

    <a href="/pages/video.html">
        Video
    </a>

    <a href="/pages/turkiye-rehberi.html">
        Rehber
    </a>

    <a href="/pages/firmalar.html">
        Firmalar
    </a>

    <a href="/pages/yazarlar.html">
        Yazarlar
    </a>

</nav>

</div>


<main class="container">

    <section class="hero">

        <h1>📰 Son Dakika Haberleri</h1>

        <p>
            Türkiye ve dünyadan son gelişmeler,
            gündem ve güncel haberler.
        </p>

    </section>


    <section id="featured">

        <div class="loading">
            Haberler yükleniyor...
        </div>

    </section>


    <section id="news"
             class="news-grid">

    </section>

</main>


<footer>

    © 2026 Digital Gündem —
    Türkiye'nin Dijital Haber Platformu

</footer>


<script>

async function haberleriGetir(){

    const featured =
        document.getElementById("featured");

    const news =
        document.getElementById("news");

    try{

        /*
         * ANA SAYFA API
         */

        const cevap =
            await fetch("/api/haberler");

        if(!cevap.ok){
            throw new Error(
                "API " + cevap.status
            );
        }

        const data =
            await cevap.json();

        if(
            !data.success ||
            !data.haberler ||
            data.haberler.length === 0
        ){

            featured.innerHTML = `
                <div class="loading">
                    Haber bulunamadı.
                </div>
            `;

            return;
        }


        const haberler =
            data.haberler;


        /*
         * İLK HABER
         */

        const ilk =
            haberler[0];

        featured.innerHTML = `

            <article class="featured">

                <div class="featured-image">
                    🌍
                </div>

                <div class="featured-content">

                    <span class="category">
                        ${ilk.kategori || "GÜNDEM"}
                    </span>

                    <h2>
                        ${ilk.baslik || ""}
                    </h2>

                    <p>
                        ${ilk.ozet || ""}
                    </p>

                </div>

            </article>

        `;


        /*
         * DİĞER HABERLER
         */

        news.innerHTML = "";

        haberler
            .slice(1, 9)
            .forEach(haber => {

                news.innerHTML += `

                    <article class="news-card">

                        <div class="news-image">
                            📰
                        </div>

                        <div class="news-content">

                            <span class="category">
                                ${haber.kategori || "GÜNDEM"}
                            </span>

                            <h3>
                                ${haber.baslik || ""}
                            </h3>

                            <p>
                                ${haber.ozet || ""}
                            </p>

                        </div>

                    </article>

                `;

            });


    }catch(error){

        console.error(
            "ANA SAYFA HATA:",
            error
        );

        featured.innerHTML = `

            <div class="loading">

                ❌ Haberler yüklenemedi.
                <br>
                Lütfen daha sonra tekrar deneyin.

            </div>

        `;

    }

}


/*
 * SAYFA AÇILINCA
 */

haberleriGetir();

</script>

</body>
</html>
